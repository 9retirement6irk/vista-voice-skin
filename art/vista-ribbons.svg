<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1250" viewBox="0 0 2000 1250" preserveAspectRatio="xMidYMid slice">
<!-- Windows Vista wallpaper-style ribbons. Each line of the big sheet starts off the left
     edge, sweeps down through the bright flare at the bottom and rises again into the
     arc on the right, running off the top of the image, so every line enters and leaves
     the screen rather than starting or stopping in view. The short "feather" lines near
     the bottom fade in from transparent instead of starting abruptly. The sheet sways
     slowly and bright pulses travel along the lines. Kept deliberately light: no blur
     filters, few paths, slow animation, opacity-only fades.
     Generated by gen.py. Transparent background: the page gradient in windows-vista.css
     supplies the teal/green/yellow/blue base. -->
<defs>
  <linearGradient id="gSheet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
    <stop offset="0" stop-color="#7dff5c" stop-opacity="0.9"/>
    <stop offset="0.45" stop-color="#7fecae" stop-opacity="0.6"/>
    <stop offset="0.72" stop-color="#d6ffff" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#7fe0ff" stop-opacity="0.7"/>
  </linearGradient>
  <linearGradient id="gLime" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
    <stop offset="0" stop-color="#fff35a" stop-opacity="0.65"/>
    <stop offset="0.5" stop-color="#b6f56a" stop-opacity="0.7"/>
    <stop offset="1" stop-color="#d8ffff" stop-opacity="0.85"/>
  </linearGradient>
  <linearGradient id="gFeather" gradientUnits="userSpaceOnUse" x1="1080" y1="0" x2="1560" y2="0">
    <stop offset="0" stop-color="#d8ffd0" stop-opacity="0"/>
    <stop offset="1" stop-color="#d8ffff" stop-opacity="0.9"/>
  </linearGradient>
  <linearGradient id="gRay" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9ffff" stop-opacity="0.5"/>
    <stop offset="0.7" stop-color="#8ff0ea" stop-opacity="0.1"/>
    <stop offset="1" stop-color="#8ff0ea" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="gFlare">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.4" stop-color="#c8fff6" stop-opacity="0.6"/>
    <stop offset="1" stop-color="#6fe8ff" stop-opacity="0"/>
  </radialGradient>
  <style>
    .sway  { transform-origin: 1300px 940px; animation: sway 34s ease-in-out infinite alternate; }
    .sway2 { transform-origin: 1300px 1000px; animation: sway 41s ease-in-out -9s infinite alternate-reverse; }
    @keyframes sway { from { transform: rotate(-0.6deg) translate(-6px, 4px); } to { transform: rotate(0.6deg) translate(8px, -4px); } }
    .pulse { stroke-dasharray: 100 900; animation: travel 16s linear infinite; }
    @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }
    .ray   { animation: fade 18s ease-in-out infinite alternate; }
    .flare { animation: fade 12s ease-in-out infinite alternate; }
    @keyframes fade { from { opacity: 0.35; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sway,.sway2,.pulse,.ray,.flare { animation: none; } }
  </style>
</defs>

<rect class="ray" x="640" y="-40" width="10" height="950" fill="url(#gRay)" transform="skewX(-6)" style="animation-delay:0s;animation-duration:16s"/>
<rect class="ray" x="830" y="-40" width="34" height="950" fill="url(#gRay)" transform="skewX(-6)" style="animation-delay:-4s;animation-duration:18s"/>
